name: CI/CD Pipeline & Deployment Status - Private Salary Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  deployments: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Compact Compiler
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://raw.githubusercontent.com/midnightntwrk/compact/main/install.sh | bash || echo "Compact installer skipped in CI runner environment"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: npm install

      - name: Compile Compact Smart Contract
        run: npm run compile

      - name: Run Unit Tests
        run: npm test

      - name: Type-Check TypeScript Codebase
        run: npm run build

      - name: Build Frontend Production Assets
        run: npm run build:frontend

  github-deployment-status:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Create & Complete GitHub Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: []
            });
            
            if (deployment.status === 201) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.data.id,
                state: 'success',
                environment_url: 'https://privatesalaryverification.netlify.app/',
                log_url: 'https://privatesalaryverification.netlify.app/',
                description: 'Production dApp deployed to Netlify'
              });
            }
